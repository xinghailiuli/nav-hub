  <meta name="description" content="极光导航 NavHub，精选二次元、Galgame、动漫与 AI 大模型入口。">
  <meta name="keywords" content="二次元, Galgame, 动漫, AI模型, 导航">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="meta-theme-color" content="#090b1a">
  <script>
(() => {
  function readState(key) {
    try {
      const state = JSON.parse(localStorage.getItem(key) ?? "null");
      return Array.isArray(state?.sites) ? state : null;
    } catch {
      return null;
    }
  }

  const state = readState("navhub.state.v2") ?? readState("navhub.state.v1");
  const themeColors = { starlight: "#090b1a", sakura: "#fff7fa", akiba: "#070614", miku: "#071521" };
  let theme = state?.theme;
  if (theme === "dark") theme = "starlight";
  if (theme === "light") theme = "sakura";
  if (typeof theme !== "string" || !Object.hasOwn(themeColors, theme)) theme = "starlight";

  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.motionPaused = String(state?.motionPaused === true);
  document.querySelector('meta[name="color-scheme"]').content = theme === "sakura" ? "light" : "dark";
  document.querySelector("#meta-theme-color").content = themeColors[theme];
})();
</script>
  <title>极光导航 NavHub · 二次元、Galgame 与 AI 模型雷达</title>
